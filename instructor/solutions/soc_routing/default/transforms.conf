[soc_drop_dns_allow]
REGEX = (?=.*\sdest_port=53\s)(?=.*\saction=allow\s)
DEST_KEY = queue
FORMAT = nullQueue

[soc_set_host_from_line]
REGEX = ^\S+\s+(\S+)\s+event_id=
DEST_KEY = MetaData:Host
FORMAT = host::$1

[soc_route_rdp_to_security]
REGEX = \sdest_port=3389\s
DEST_KEY = _MetaData:Index
FORMAT = security
