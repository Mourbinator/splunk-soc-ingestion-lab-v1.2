[soc:app]
# Un nouvel événement commence UNIQUEMENT là où une ligne débute par un horodatage « 2026-10-10 00:00:07,412 ».
# Les lignes de stack trace (tabulation + "at ...", "Caused by: ...") restent collées à l'événement parent.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\s)
TRUNCATE = 20000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 25
TZ = UTC

EXTRACT-soc_app_head = ^\S+\s+\S+\s+(?<level>[A-Z]+)\s+\[(?<service>[^\]]+)\]
EXTRACT-soc_app_exception = (?m)^(?<exception_class>[\w.]+(?:Exception|Error)):\s(?<exception_message>[^\r\n]+)
