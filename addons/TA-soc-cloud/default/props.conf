# Tous ces sourcetypes sont du JSON « une ligne = un événement ».
# KV_MODE = json extrait les champs au search-time (pas de INDEXED_EXTRACTIONS : on évite de gonfler les index).
# Remarque : si les événements arrivent par HEC (endpoint /event), le temps fourni par l'émetteur est utilisé
# et TIME_PREFIX/TIME_FORMAT ne s'appliquent pas ; ils servent pour les fichiers et l'endpoint /raw.

[aws:cloudtrail]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "eventTime"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
FIELDALIAS-soc_aws_user = userIdentity.userName AS user
FIELDALIAS-soc_aws_src = sourceIPAddress AS src
FIELDALIAS-soc_aws_sig = eventName AS signature
EVAL-action = if(isnotnull(errorCode),"failure","success")
EVAL-vendor_product = "AWS CloudTrail"

[azure:activity]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
FIELDALIAS-soc_az_user = caller AS user
FIELDALIAS-soc_az_sig = operationName AS signature
FIELDALIAS-soc_az_obj = resourceId AS object
EVAL-vendor_product = "Azure Activity Log"

[gcp:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
FIELDALIAS-soc_gcp_user = protoPayload.authenticationInfo.principalEmail AS user
FIELDALIAS-soc_gcp_sig = protoPayload.methodName AS signature
EVAL-vendor_product = "GCP Audit Logs"

[m365:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "CreationTime"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
FIELDALIAS-soc_m365_user = UserId AS user
FIELDALIAS-soc_m365_src = ClientIP AS src
FIELDALIAS-soc_m365_sig = Operation AS signature
EVAL-action = case(ResultStatus=="Success","success", ResultStatus=="Failed","failure")
EVAL-app = Workload
EVAL-vendor_product = "Microsoft 365 Audit"

[soc:saas:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "event_time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
FIELDALIAS-soc_saas_user = actor AS user
FIELDALIAS-soc_saas_src = source_ip AS src
FIELDALIAS-soc_saas_obj = target AS object
# On copie la valeur brute dans signature AVANT que l'EVAL ne remplace « action » (alias avant champs calculés).
FIELDALIAS-soc_saas_sig = action AS signature
EVAL-action = case(signature=="login_ok","success", signature=="login_failed","failure")
EVAL-vendor_product = "SOC-Lab SaaS"
