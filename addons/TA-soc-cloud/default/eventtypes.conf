[soc_m365_login]
search = sourcetype=m365:audit (Operation=UserLoggedIn OR Operation=UserLoginFailed)

[soc_saas_login]
search = sourcetype=soc:saas:audit (signature=login_ok OR signature=login_failed)

[soc_aws_console_login]
search = sourcetype=aws:cloudtrail eventName=ConsoleLogin

[soc_cloud_iam_change]
search = (sourcetype=aws:cloudtrail eventSource=iam.amazonaws.com) OR (sourcetype=azure:activity operationName="Microsoft.Authorization/*") OR (sourcetype=gcp:audit signature=*ServiceAccountKey)
