[linux:auth]
# ===== INDEX-TIME =====
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
# Pas d'année ni de fuseau dans le format syslog : Splunk déduit l'année ; le fuseau est imposé ici (VM en UTC).
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC

# ===== SEARCH-TIME =====
EXTRACT-soc_ssh_result = sshd\[(?<pid>\d+)\]:\s+(?<ssh_result>Failed|Accepted)\s+(?<auth_method>password|publickey)\s+for\s+(?:invalid user\s+)?(?<user>\S+)\s+from\s+(?<src>\d{1,3}(?:\.\d{1,3}){3})\s+port\s+(?<src_port>\d+)
EXTRACT-soc_ssh_invalid = sshd\[(?<pid>\d+)\]:\s+Invalid user\s+(?<user>\S+)\s+from\s+(?<src>\d{1,3}(?:\.\d{1,3}){3})\s+port\s+(?<src_port>\d+)
EXTRACT-soc_sudo = sudo:\s+(?<user>\S+)\s+:\s+TTY=\S+\s+;\s+PWD=\S+\s+;\s+USER=(?<run_as>\S+)\s+;\s+COMMAND=(?<command>.+)$
FIELDALIAS-soc_linux_dest = host AS dest
EVAL-action = case(ssh_result=="Accepted","success", ssh_result=="Failed" OR match(_raw,"Invalid user"),"failure")
EVAL-app = case(match(_raw,"sshd\["),"sshd", match(_raw,"sudo:"),"sudo")
EVAL-vendor_product = "OpenSSH / sudo"
