[soc:firewall]
# ===== INDEX-TIME (appliqué par le PREMIER composant qui parse : indexeur ou Heavy Forwarder) =====
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
TIME_PREFIX = \bevent_time=
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 30

# ===== SEARCH-TIME (appliqué sur le Search Head ; ici le même Splunk) =====
# KV_MODE = none : on désactive l'extraction automatique pour éviter les champs en double avec REPORT-.
KV_MODE = none
REPORT-soc_firewall_kv = soc_firewall_kv_quoted, soc_firewall_kv_plain

# Ordre d'exécution Splunk : extractions -> FIELDALIAS -> EVAL (champs calculés) -> LOOKUP -> eventtypes -> tags
FIELDALIAS-soc_firewall_src = src_ip AS src
FIELDALIAS-soc_firewall_dest = dest_ip AS dest
FIELDALIAS-soc_firewall_rule = rule_id AS rule
# On garde la valeur brute dans action_raw AVANT que l'EVAL ci-dessous ne remplace « action » par la valeur CIM.
FIELDALIAS-soc_firewall_action_raw = action AS action_raw
EVAL-action = case(lower(action_raw)=="allow","allowed", lower(action_raw)=="deny" OR lower(action_raw)=="drop","blocked", true(),"unknown")
EVAL-transport = lower(protocol)
EVAL-vendor_product = "SOC-Lab Firewall"
