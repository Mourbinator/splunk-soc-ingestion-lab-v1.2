# Enrichissement AUTOMATIQUE au search-time pour soc:firewall.
# Format : LOOKUP-<nom> = <lookup> <champ_d_entrée_du_lookup> [AS <champ_de_l'événement>] OUTPUT <champs>
[soc:firewall]
LOOKUP-soc_fw_rule = soc_fw_rules rule_id OUTPUT rule_name rule_severity
LOOKUP-soc_dest_asset = soc_assets ip AS dest_ip OUTPUT dest_name dest_category dest_priority dest_owner
LOOKUP-soc_src_zone = soc_ip_zones cidr AS src_ip OUTPUT zone AS src_zone
LOOKUP-soc_dest_zone = soc_ip_zones cidr AS dest_ip OUTPUT zone AS dest_zone
