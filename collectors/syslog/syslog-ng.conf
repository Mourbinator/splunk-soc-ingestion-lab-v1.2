@version: 3.38
@include "scl.conf"
# Version autonome (Docker) : les options globales remplacent celles du syslog-ng.conf d Ubuntu.
options { chain_hostnames(no); use_dns(no); use_fqdn(no); keep_hostname(yes); stats_freq(60); };

# =====================================================================
# /etc/syslog-ng/conf.d/soc-lab.conf  — collecteur Syslog du lab SOC
# Inclus automatiquement par le /etc/syslog-ng/syslog-ng.conf d'Ubuntu (dossier conf.d).
# Reçoit du RFC 5424 sur 5514/UDP et 5514/TCP, puis ROUTE par APP-NAME :
#   soc-firewall  -> /var/log/soc-lab/firewall/firewall.log   (lu par l'UF, sourcetype soc:firewall)
#   tout le reste -> /var/log/soc-lab/unrouted/unrouted.log   (rien ne se perd silencieusement)
# =====================================================================

source s_soc_udp {
    network(ip("0.0.0.0") port(5514) transport("udp") flags(syslog-protocol));
};
source s_soc_tcp {
    network(ip("0.0.0.0") port(5514) transport("tcp") flags(syslog-protocol) max-connections(50));
};

# Une ligne = « date-ISO  hôte-émetteur  message » (le message contient déjà event_id=... event_time=...)
template t_soc_line { template("${ISODATE} ${HOST} ${MSG}\n"); };

filter f_soc_firewall { program("^soc-firewall$"); };
filter f_soc_other    { not filter(f_soc_firewall); };

destination d_soc_firewall {
    file("/var/log/soc-lab/firewall/firewall.log" template(t_soc_line)
         create-dirs(yes) owner("root") group("adm") perm(0640) dir-perm(0750));
};
destination d_soc_unrouted {
    file("/var/log/soc-lab/unrouted/unrouted.log" template(t_soc_line)
         create-dirs(yes) owner("root") group("adm") perm(0640) dir-perm(0750));
};

log { source(s_soc_udp); source(s_soc_tcp); filter(f_soc_firewall); destination(d_soc_firewall); };
log { source(s_soc_udp); source(s_soc_tcp); filter(f_soc_other);    destination(d_soc_unrouted); };
