# Variante rsyslog (à utiliser À LA PLACE de syslog-ng, jamais en même temps sur le même port).
# Copier vers /etc/rsyslog.d/30-soc-lab.conf puis :  sudo systemctl restart rsyslog
# ATTENTION : la forme exacte de %msg% dépend de la version/du parseur : comparez avec le fichier produit
# par syslog-ng (« head -2 firewall.log »). Le TA reste valable tant que « event_time=... » est présent.
module(load="imudp")
module(load="imtcp")
template(name="t_soc_line" type="string" string="%timegenerated:::date-rfc3339% %hostname% %msg%\n")
ruleset(name="soc_in") {
    if $programname == 'soc-firewall' then {
        action(type="omfile" file="/var/log/soc-lab/firewall/firewall.log" template="t_soc_line"
               createDirs="on" dirCreateMode="0750" fileCreateMode="0640" fileOwner="root" fileGroup="adm")
        stop
    }
    action(type="omfile" file="/var/log/soc-lab/unrouted/unrouted.log" template="t_soc_line"
           createDirs="on" dirCreateMode="0750" fileCreateMode="0640" fileOwner="root" fileGroup="adm")
}
input(type="imudp" port="5514" ruleset="soc_in")
input(type="imtcp" port="5514" ruleset="soc_in")
