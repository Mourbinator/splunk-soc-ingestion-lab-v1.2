# 7 index du lab. Rétention 90 jours (7776000 s) et plafond de 2 Go par index : adaptez à votre disque.
# $SPLUNK_DB est le dossier de données de Splunk (sous Windows : ...\Splunk\var\lib\splunk).

[win_event]
homePath   = $SPLUNK_DB/win_event/db
coldPath   = $SPLUNK_DB/win_event/colddb
thawedPath = $SPLUNK_DB/win_event/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 2000

