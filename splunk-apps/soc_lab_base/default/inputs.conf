# Réception S2S (équivalent de Settings > Forwarding and receiving > Configure receiving).
[splunktcp://9997]
disabled = 0

# HEC : activation globale. Le TOKEN se crée dans Splunk Web (Settings > Data inputs > HTTP Event Collector)
# et ne doit JAMAIS être écrit dans ce dépôt. Index autorisés recommandés pour ce token : saas, lab_api.
[http]
disabled = 0
enableSSL = 1
port = 8088
