# Recherches de qualité du lab. TOUTES sont désactivées (disabled = 1) : activez-les une par une en E9.
# Elles n'ont pas été exécutées sur votre version de Splunk : validez chaque SPL dans Splunk Web avant de l'activer.

[SOC Q01 - Volume par sourcetype et host (15 min)]
disabled = 1
search = | tstats count where index IN (network,linux,cloud,saas,win_event,security,lab_api) earliest=-15m by index sourcetype host
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 0

[SOC Q02 - Fraicheur : derniere observation par sourcetype]
disabled = 1
search = | tstats latest(_time) as last_seen where index IN (network,linux,cloud,saas,lab_api) by index sourcetype | eval age_s=now()-last_seen | eval status=if(age_s>300,"STALE","OK") | sort - age_s
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q03 - Retard d indexation firewall (SLO 95 pct sous 120 s)]
disabled = 1
search = index=network sourcetype=soc:firewall | eval lag=_indextime-_time | stats count perc95(lag) as p95_lag avg(lag) as avg_lag by host | eval slo=if(p95_lag<=120,"OK","BREACH")
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 0

[SOC Q04 - Champs obligatoires manquants firewall]
disabled = 1
search = index=network sourcetype=soc:firewall | eval missing=mvappend(if(isnull(event_id),"event_id",null()),if(isnull(src_ip),"src_ip",null()),if(isnull(dest_ip),"dest_ip",null()),if(isnull(src_port),"src_port",null()),if(isnull(dest_port),"dest_port",null()),if(isnull(action_raw),"action",null()),if(isnull(protocol),"protocol",null()),if(isnull(rule_id),"rule_id",null())) | where isnotnull(missing) | stats count by missing
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q05 - Doublons event_id firewall]
disabled = 1
search = index=network sourcetype=soc:firewall | stats count as copies by event_id | where copies>1 | sort - copies
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q06 - Trous de sequence firewall par lot]
disabled = 1
search = index=network sourcetype=soc:firewall | rex field=event_id "^fw-(?<run>[a-z0-9]+)-(?<seq>\d+)$" | where isnotnull(seq) | eval seq=tonumber(seq) | stats min(seq) as first max(seq) as last dc(seq) as received by run | eval expected=last-first+1 | eval missing=expected-received
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q07 - Valeurs d action inconnues]
disabled = 1
search = index=network sourcetype=soc:firewall | where NOT (lower(action_raw) IN ("allow","deny","drop")) OR isnull(action_raw) | stats count values(event_id) as examples by action_raw
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q08 - Derive de format firewall (lignes hors contrat)]
disabled = 1
search = index=network sourcetype=soc:firewall | regex _raw!="event_id=\S+\s+event_time=\S+\s+src_ip=\S+\s+dest_ip=\S+" | stats count values(_raw) as examples
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q09 - Erreurs de parsing (horodatage et decoupage)]
disabled = 1
search = index=_internal sourcetype=splunkd log_level IN (WARN,ERROR) (component=DateParserVerbose OR component=LineBreakingProcessor OR component=AggregatorMiningProcessor) | stats count by component host source
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q10 - Connexions des forwarders vers l indexeur]
disabled = 1
search = index=_internal source=*metrics.log* group=tcpin_connections | stats latest(_time) as last_seen sum(kb) as kb by hostname sourceIp | eval age_s=now()-last_seen | eval status=if(age_s>300,"SILENT","OK")
dispatch.earliest_time = -60m
dispatch.latest_time = now
enableSched = 0

[SOC Q11 - Erreurs HEC cote Splunk]
disabled = 1
search = index=_internal sourcetype=splunkd component=HttpInputDataHandler log_level IN (WARN,ERROR) | stats count values(_raw) as examples by host
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q12 - Metriques du poller API]
disabled = 1
search = index=lab_api sourcetype=soc:poller:metrics | table _time fetched sent duplicates_skipped rejected retried http_429 http_5xx pages
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q13 - Evenements recus pour un index inexistant]
disabled = 1
search = index=_internal sourcetype=splunkd "unconfigured/disabled/deleted index" | rex "index='(?<bad_index>[^']+)'" | stats count by bad_index host
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0

[SOC Q14 - Files d attente bloquees (blocked=true)]
disabled = 1
search = index=_internal source=*metrics.log* group=queue blocked=true | stats count by name host
dispatch.earliest_time = -4h
dispatch.latest_time = now
enableSched = 0
