# À placer dans %SPLUNK_HOME%\etc\system\local\ du Deployment Server (ou dans une app dédiée).
# Les apps à distribuer se trouvent dans %SPLUNK_HOME%\etc\deployment-apps\<nom_app>\...
[global]
# (rien de global)

[serverClass:linux_uf]
# Les clients dont le clientName/hostname correspond sont membres de la classe.
whitelist.0 = ubuntu-lab*

[serverClass:linux_uf:app:soc_uf_outputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:linux_uf:app:soc_uf_linux]
restartSplunkd = true
stateOnClient = enabled
