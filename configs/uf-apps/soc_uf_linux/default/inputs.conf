# Inputs de l'UF Linux (VM Ubuntu). Un stanza = une source. « disabled = 1 » = préparée mais inactive.

# --- Firewall reçu par syslog-ng (le collecteur écrit ce fichier) --------------------------------
[monitor:///var/log/soc-lab/firewall]
disabled = 0
whitelist = firewall\.log$
index = network
sourcetype = soc:firewall

# --- Messages syslog non routés (APP-NAME inconnu) -----------------------------------------------
[monitor:///var/log/soc-lab/unrouted]
disabled = 0
whitelist = unrouted\.log$
index = lab_api
sourcetype = soc:unrouted

# --- Authentifications Linux SIMULÉES (écrites par generators/write_linux_logs.py) ---------------
[monitor:///var/log/soc-lab/generated]
disabled = 0
whitelist = \.log$
index = linux
sourcetype = linux:auth

# --- Vrais fichiers système (droits : l'utilisateur de l'UF doit être dans le groupe « adm ») -----
[monitor:///var/log/auth.log]
disabled = 1
index = linux
sourcetype = linux:auth

[monitor:///var/log/syslog]
disabled = 1
index = linux
sourcetype = linux:syslog

# --- Journal applicatif multi-lignes (activé au module M4) ---------------------------------------
[monitor:///var/log/soc-lab/app]
disabled = 1
whitelist = \.log$
index = lab_api
sourcetype = soc:app

# --- Projet final : journaux web (activé en E10) --------------------------------------------------
[monitor:///var/log/soc-lab/web]
disabled = 1
whitelist = \.log$
index = network
sourcetype = soc:web:access
