# Où l'UF envoie ses données. REMPLACER 10.50.0.10 par l'IP du PC Splunk.
[tcpout]
defaultGroup = soc_lab

[tcpout:soc_lab]
server = 10.50.0.10:9997
# Accusé de réception : l'UF garde les données tant que l'indexeur n'a pas confirmé (anti-perte).
useACK = true
# Réévalue la cible toutes les 30 s (utile quand il y a plusieurs serveurs dans la liste).
autoLBFrequency = 30
